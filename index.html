<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Timeline Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e2e0d9;--ac:#2f6f5e;--acx:#fff;--done:#8bc34a;--prog:#f5b942;--not:#c4c9d2;--late:#ef5350;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#202327;--tx:#e8e8e6;--mut:#9aa0a8;--bd:#33373d;--ac:#5fb59c;--acx:#10231d;--not:#4a505a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191c;--card:#202327;--tx:#e8e8e6;--mut:#9aa0a8;--bd:#33373d;--ac:#5fb59c;--acx:#10231d;--not:#4a505a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.danger{color:var(--late)}
select,input,textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 9px;width:100%}
.yr{width:auto;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.pc{cursor:pointer}.pc:hover{border-color:var(--ac)}
.mut{color:var(--mut);font-size:12.5px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px;display:flex}
.bar i{display:block;height:100%}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#1b1b1b}
.late{color:var(--late);font-weight:600}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;min-width:110px}
.sum b{display:block;font-size:20px}
.gw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-width:100%}
table{border-collapse:collapse;font-size:13px;width:max-content}
th,td{border-bottom:1px solid var(--bd);padding:4px 8px;white-space:nowrap;text-align:left}
thead th{background:var(--card);font-size:11.5px;color:var(--mut);text-align:center;padding:3px 0}
.c1{position:sticky;left:0;background:var(--card);min-width:250px;max-width:250px;overflow:hidden;text-overflow:ellipsis;z-index:1}
tr.st td{background:var(--bg);font-weight:700;color:var(--ac);padding:5px 8px}
tr.st td.c1{background:var(--bg)}
tr.t{cursor:pointer}tr.t:hover td{background:color-mix(in srgb,var(--ac) 8%,var(--card))}
tr.t:hover td.c1{background:color-mix(in srgb,var(--ac) 8%,var(--card))}
td.w,th.w{width:22px;min-width:22px;padding:0;border-left:1px solid var(--bd)}
td.w.on{background:var(--c)}
th.w.now,td.w.now{box-shadow:inset 0 0 0 1px var(--ac)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(460px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.leg span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
</style></head>
<body><div class="wrap">
<header>
  <div class="row"><h1>Product Timeline</h1><select id="yr" class="yr"></select></div>
  <div class="row"><span class="mut" id="sync"></span><button id="exp" title="Tải file sao lưu">Xuất JSON</button><button id="imp" title="Nhập từ file sao lưu">Nhập JSON</button><input type="file" id="impF" accept=".json,application/json" hidden><button class="pri" id="newP">+ Sản phẩm mới</button></div>
</header>
<main id="main"><div class="empty">Đang tải dữ liệu…</div></main>
</div>

<dialog id="dP"><h2 id="dPt">Sản phẩm mới</h2>
  <label>Tên sản phẩm</label><input id="pName" placeholder="VD: Syrup Smoked Tea">
  <div class="two"><div><label>Nhóm / dòng sản phẩm</label><input id="pCat" placeholder="VD: Andros Pro"></div>
  <div><label>Ngày ra mắt dự kiến</label><input id="pLaunch" type="date"></div></div>
  <label>Năm</label><input id="pYear" type="number" min="2027" max="2100">
  <label id="tplL" class="row" style="color:var(--tx)"><input id="pTpl" type="checkbox" checked style="width:auto"> Tạo sẵn danh sách công việc mẫu (R&amp;D, Costing, QA, Packaging, Production, Sales, MKT)</label>
  <div class="row" style="margin-top:16px;justify-content:space-between"><button class="danger" id="pDel">Xóa</button>
  <div class="row"><button id="pCancel">Hủy</button><button class="pri" id="pOk">Lưu</button></div></div></dialog>

<dialog id="dT"><h2 id="dTt">Công việc</h2>
  <label>Giai đoạn</label><select id="tStage"></select>
  <label>Công việc</label><input id="tName">
  <div class="two"><div><label>PIC (người phụ trách)</label><input id="tPic" placeholder="NPD, RD…"></div>
  <div><label>Trạng thái</label><select id="tStat"><option value="not">Chưa làm</option><option value="prog">Đang làm</option><option value="done">Hoàn thành</option></select></div></div>
  <div class="two"><div><label>Bắt đầu</label><input id="tS" type="date"></div><div><label>Hạn / kết thúc</label><input id="tE" type="date"></div></div>
  <label>Ghi chú</label><textarea id="tNote" rows="2"></textarea>
  <div class="row" style="margin-top:16px;justify-content:space-between"><button class="danger" id="tDel">Xóa</button>
  <div class="row"><button id="tCancel">Hủy</button><button class="pri" id="tOk">Lưu</button></div></div></dialog>

<script>
const STAGES=["R&D (recipe)","Costing","QA","Purchasing / Packaging","Production","Sales","MKT & events"];
const TPL=[
[0,"Concept making","NPD"],[0,"Sending NPD brief","NPD"],[0,"Development of first samples","RD"],[0,"Testing samples (go/no go)","NPD, RD, Chef, Sales"],[0,"Concept proposal & finalization","NPD"],[0,"Recipe development + tasting","RD/NPD"],[0,"Validation of final recipe","NPD/RD"],[0,"Sending NPD launching file","NPD"],[0,"Sending specification","RD"],[0,"Confirmation of claims & attributes","RD, NPD, QA"],[0,"Shelf-life test & confirm","RD"],
[1,"Price of packaging / new ingredients","Purchasing"],[1,"Send recipe to Cost control","RD, Cost"],[1,"Draft CVS price calculation","Cost"],[1,"OK CVS / selling price","Cost, NPD"],[1,"Final CVS price","Cost, NPD"],[1,"Final selling price","Cost, NPD, Sales"],
[2,"Sending sample for analysis & HSCB","RD, QA"],[2,"Nutrition value & promulgation","QA"],[2,"Validation of HSCB","QA"],[2,"Layout design label draft","NPD, Designer, QA"],[2,"Photoshooting","NPD"],[2,"Check labels & final artwork","NPD, QA, Designer"],[2,"Final artwork sent to printer","NPD, Design"],
[3,"Cylinder & proof approval label","Purchasing, NPD"],[3,"Order & receive label","Purchasing"],[3,"Order & receive packaging (doypack)","Purchasing"],[3,"Order & receive flavours / new ingredients","Purchasing"],
[4,"Trial production (small batch)","Prod, Process, RD"],[4,"Trial successful (big batch)","Prod, Process, RD"],[4,"Quality test","QC"],[4,"Approval of final products","RD, Quality, NPD"],
[5,"Samples for photoshooting & application","RD, Prod"],[5,"Packshot, label","NPD, Designer"],[5,"Product presentation","NPD"],[5,"Application recipe development","NPD"],[5,"Final pictures retouched","NPD"],[5,"Training for sales","NPD, Sales, MKT"],
[6,"Samples for applications creation","Prod, RD"],[6,"Photoshooting MKT","MKT"],[6,"Samples for workshop","Prod, RD"],[6,"Logistic to nationwide","Supply Chain"],[6,"Announcement of product launching","NPD"],[6,"Events / workshop","MKT"],[6,"Marketing - social media launch","MKT"]];
const ST={done:["Hoàn thành","var(--done)"],prog:["Đang làm","var(--prog)"],not:["Chưa làm","var(--not)"],late:["Trễ","var(--late)"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
const fmt=d=>d?d.slice(8)+"/"+d.slice(5,7):"";
let P=[],col=null,year=Math.max(2027,new Date().getFullYear()),pid=null,editT=null,editP=null,loaded=false;

function eff(t){return t.status!=="done"&&t.end&&t.end<today?"late":t.status}
function wk(d,y){const dt=new Date(d+"T00:00:00Z"),Y=dt.getUTCFullYear();if(Y<y)return 1;if(Y>y)return 52;
  return Math.min(52,Math.floor((dt-Date.UTC(y,0,1))/864e5/7)+1)}
function stats(p){const c={done:0,prog:0,not:0,late:0};(p.tasks||[]).forEach(t=>c[eff(t)]++);const n=(p.tasks||[]).length;return{c,n,pct:n?Math.round(c.done/n*100):0}}

/* ---------- lưu trữ ---------- */
function lsLoad(){try{P=JSON.parse(localStorage.getItem("prod_tracker_v1")||"[]")}catch(e){P=[]}}
function lsSave(){try{localStorage.setItem("prod_tracker_v1",JSON.stringify(P))}catch(e){}}
async function save(p){const i=P.findIndex(x=>x.id===p.id);i<0?P.push(p):P[i]=p;
  if(col){try{await col.doc(p.id).set(p)}catch(e){$("sync").textContent="Lỗi lưu: "+(e.message||e.code)}}else lsSave();render()}
async function removeP(id){P=P.filter(x=>x.id!==id);if(col){try{await col.doc(id).delete()}catch(e){}}else lsSave();render()}
lsLoad();$("sync").textContent="Lưu trên trình duyệt này";loaded=true;render();

/* ---------- giao diện ---------- */
function render(){
  const ys=new Set([2027,2028,year]);P.forEach(p=>ys.add(p.year));const mx=Math.max(...ys);ys.add(mx+1);
  $("yr").innerHTML=[...ys].sort().map(y=>`<option ${y===year?"selected":""}>${y}</option>`).join("");
  if(!loaded)return;
  const p=P.find(x=>x.id===pid);
  $("main").innerHTML=p?detail(p):overview();
}
function overview(){
  const ps=P.filter(p=>p.year===year).sort((a,b)=>(a.launch||"9").localeCompare(b.launch||"9"));
  let tot={done:0,prog:0,not:0,late:0};
  const cards=ps.map(p=>{const s=stats(p);for(const k in tot)tot[k]+=s.c[k];
    const next=(p.tasks||[]).filter(t=>t.status!=="done"&&t.end).sort((a,b)=>a.end.localeCompare(b.end))[0];
    return `<div class="card pc" data-p="${p.id}"><b>${esc(p.name)}</b><div class="mut">${esc(p.category||"—")}${p.launch?" · Ra mắt "+fmt(p.launch)+"/"+p.launch.slice(0,4):""}</div>
    <div class="bar">${["done","prog","not","late"].map(k=>`<i style="width:${s.n?s.c[k]/s.n*100:0}%;background:${ST[k][1]}"></i>`).join("")}</div>
    <div class="mut">${s.pct}% hoàn thành · ${s.c.done}/${s.n} việc${s.c.late?` · <span class="late">${s.c.late} trễ</span>`:""}</div>
    ${next?`<div class="mut" style="margin-top:6px">Tiếp theo: ${esc(next.name)} (${fmt(next.end)})</div>`:""}</div>`}).join("");
  return `<h2>Tổng quan năm ${year}</h2>
  <div class="sum"><div><b>${ps.length}</b>Sản phẩm</div><div><b>${tot.done}</b>Hoàn thành</div><div><b>${tot.prog}</b>Đang làm</div><div><b>${tot.not}</b>Chưa làm</div><div><b class="late">${tot.late}</b>Trễ hạn</div></div>`+
  (ps.length?`<div class="grid">${cards}</div>`:`<div class="empty card">Chưa có sản phẩm nào cho năm ${year}.<br>Bấm “+ Sản phẩm mới” để bắt đầu.</div>`);
}
function detail(p){
  const s=stats(p),ws=[...Array(52)].map((_,i)=>i+1),nowW=today.slice(0,4)==String(p.year)?wk(today,p.year):0;
  const mons=[];ws.forEach(w=>{const m=new Date(Date.UTC(p.year,0,1+(w-1)*7)).getUTCMonth();const l=mons[mons.length-1];l&&l.m===m?l.n++:mons.push({m,n:1})});
  const mn=["T1","T2","T3","T4","T5","T6","T7","T8","T9","T10","T11","T12"];
  let rows="";
  STAGES.forEach((sn,si)=>{const ts=(p.tasks||[]).filter(t=>t.stage===si);if(!ts.length)return;
    rows+=`<tr class="st"><td class="c1">${esc(sn)}</td><td colspan="${3+52}"></td></tr>`;
    ts.sort((a,b)=>(a.start||a.end||"9").localeCompare(b.start||b.end||"9")).forEach(t=>{
      const e=eff(t),a=t.start||t.end,b=t.end||t.start,w1=a?wk(a,p.year):0,w2=b?wk(b,p.year):0;
      rows+=`<tr class="t" data-t="${t.id}" style="--c:${ST[e][1]}"><td class="c1" title="${esc(t.name)}">${esc(t.name)}</td><td>${esc(t.pic)}</td>
      <td><span class="pill" style="background:${ST[e][1]}">${ST[e][0]}</span></td><td class="mut">${fmt(t.end)}</td>
      ${ws.map(w=>`<td class="w${a&&w>=Math.min(w1,w2)&&w<=Math.max(w1,w2)?" on":""}${w===nowW?" now":""}"></td>`).join("")}</tr>`})});
  return `<div class="row" style="justify-content:space-between"><div><button id="back">← Năm ${p.year}</button></div>
  <div class="row"><button id="editP">Sửa sản phẩm</button><button class="pri" id="addT">+ Thêm công việc</button></div></div>
  <h2 style="margin-top:12px">${esc(p.name)}</h2><div class="mut">${esc(p.category||"")}${p.launch?" · Ra mắt dự kiến "+fmt(p.launch)+"/"+p.launch.slice(0,4):""} · ${s.pct}% hoàn thành</div>
  <div class="leg">${["done","prog","not","late"].map(k=>`<span style="--c:${ST[k][1]}">${ST[k][0]} (${s.c[k]})</span>`).join("")}</div>
  ${rows?`<div class="gw"><table><thead><tr><th class="c1">Công việc</th><th>PIC</th><th>Trạng thái</th><th>Hạn</th>${mons.map(m=>`<th class="w" colspan="${m.n}">${mn[m.m]}</th>`).join("")}</tr>
  <tr><th class="c1"></th><th></th><th></th><th></th>${ws.map(w=>`<th class="w${w===nowW?" now":""}" style="font-size:9px">${w}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="empty card">Chưa có công việc. Bấm “+ Thêm công việc”.</div>`}
  <div class="mut" style="margin-top:8px">Bấm vào một dòng để sửa. Việc quá hạn mà chưa hoàn thành sẽ tự chuyển sang “Trễ”. Cột số = tuần trong năm (W1–W52).</div>`;
}

/* ---------- sự kiện ---------- */
$("yr").onchange=e=>{year=+e.target.value;pid=null;render()};
$("main").onclick=e=>{
  const c=e.target.closest("[data-p]");if(c){pid=c.dataset.p;render();return}
  const r=e.target.closest("[data-t]");if(r){openT(r.dataset.t);return}
  if(e.target.id==="back"){pid=null;render()}
  if(e.target.id==="addT")openT(null);
  if(e.target.id==="editP")openP(P.find(x=>x.id===pid));
};
$("newP").onclick=()=>openP(null);
function openP(p){editP=p;$("dPt").textContent=p?"Sửa sản phẩm":"Sản phẩm mới";
  $("pName").value=p?.name||"";$("pCat").value=p?.category||"";$("pLaunch").value=p?.launch||"";$("pYear").value=p?.year||year;
  $("tplL").style.display=p?"none":"flex";$("pDel").style.display=p?"":"none";$("dP").showModal()}
$("pCancel").onclick=()=>$("dP").close();
$("pOk").onclick=async()=>{const name=$("pName").value.trim();if(!name){$("pName").focus();return}
  const y=Math.max(2027,+$("pYear").value||year);
  const p=editP?{...editP}:{id:uid(),tasks:$("pTpl").checked?TPL.map(([s,n,pic])=>({id:uid(),stage:s,name:n,pic,status:"not",start:"",end:"",note:""})):[]};
  Object.assign(p,{name,category:$("pCat").value.trim(),launch:$("pLaunch").value,year:y});
  $("dP").close();year=y;if(!editP)pid=p.id;await save(p)};
$("pDel").onclick=async()=>{if(confirm("Xóa sản phẩm này và toàn bộ công việc?")){$("dP").close();pid=null;await removeP(editP.id)}};
function openT(id){const p=P.find(x=>x.id===pid);const t=id?p.tasks.find(x=>x.id===id):null;editT=t;
  $("tStage").innerHTML=STAGES.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join("");
  $("dTt").textContent=t?"Sửa công việc":"Thêm công việc";
  $("tStage").value=t?t.stage:0;$("tName").value=t?.name||"";$("tPic").value=t?.pic||"";$("tStat").value=t?.status||"not";
  $("tS").value=t?.start||"";$("tE").value=t?.end||"";$("tNote").value=t?.note||"";$("tDel").style.display=t?"":"none";$("dT").showModal()}
$("tCancel").onclick=()=>$("dT").close();
$("tOk").onclick=async()=>{const name=$("tName").value.trim();if(!name){$("tName").focus();return}
  const p=JSON.parse(JSON.stringify(P.find(x=>x.id===pid)));
  const o={id:editT?.id||uid(),stage:+$("tStage").value,name,pic:$("tPic").value.trim(),status:$("tStat").value,start:$("tS").value,end:$("tE").value,note:$("tNote").value.trim()};
  if(o.start&&o.end&&o.start>o.end)[o.start,o.end]=[o.end,o.start];
  const i=p.tasks.findIndex(x=>x.id===o.id);i<0?p.tasks.push(o):p.tasks[i]=o;$("dT").close();await save(p)};
$("tDel").onclick=async()=>{const p=JSON.parse(JSON.stringify(P.find(x=>x.id===pid)));p.tasks=p.tasks.filter(x=>x.id!==editT.id);$("dT").close();await save(p)};

$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:"application/json"}));
  a.download="product-tracker-"+today+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("imp").onclick=()=>$("impF").click();
$("impF").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d)||d.some(p=>!p.id||!p.name))throw 0;
    if(!confirm("Nhập "+d.length+" sản phẩm? Sản phẩm trùng ID sẽ bị ghi đè."))return;
    d.forEach(p=>{const i=P.findIndex(x=>x.id===p.id);i<0?P.push(p):P[i]=p});lsSave();render()}
  catch(_){alert("File không hợp lệ.")}};
</script></body></html>
