<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Product Timeline Tracker</title>
  <meta name="description" content="Theo dõi tiến độ phát triển sản phẩm theo chu kỳ 03/2026–03/2027, chỉnh sửa trực tiếp trên timeline, quản lý mẫu R&D và báo cáo tổng quan.">
  <meta property="og:title" content="Product Timeline Tracker">
  <meta property="og:description" content="Quản lý timeline phát triển sản phẩm, mẫu R&D, lịch sử giá và báo cáo tiến độ tổng quan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#report" class="brand-wordmark" id="brandLink">Product Timeline</a>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <button type="button" class="nav-link active" data-tab="report">Báo cáo tổng quan</button>
        <button type="button" class="nav-link" data-tab="products">Sản phẩm</button>
        <button type="button" class="nav-link" data-tab="samples">Mẫu R&amp;D &amp; Giá</button>
      </nav>
      <div class="topbar-cta">
        <button type="button" class="btn-pri" id="newProductBtn">+ Sản phẩm mới</button>
      </div>
    </div>
  </header>

  <div class="workspace-bar">
    <div class="workspace-bar-inner">
      <div class="cycle-picker">
        <label for="cycleSelect" class="cycle-label">Chu kỳ kế hoạch:</label>
        <select id="cycleSelect" class="select-auto"></select>
      </div>
      <div class="toolbar-group">
        <button type="button" class="btn-sm" id="themeToggleBtn">Chế độ tối</button>
        <button type="button" class="btn-sm" id="exportBtn" title="Tải file sao lưu JSON">Xuất JSON</button>
        <button type="button" class="btn-sm" id="importBtn" title="Nhập từ file sao lưu JSON">Nhập JSON</button>
        <input type="file" id="importFileInput" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>

  <main id="main" class="wrap"></main>

  <!-- Modal Sản phẩm -->
  <dialog id="productDialog">
    <h3 id="prodDlgTitle">Sản phẩm mới</h3>
    <label for="pName">Tên sản phẩm</label>
    <input type="text" id="pName" placeholder="VD: Syrup Smoked Tea">

    <div class="form-grid-2">
      <div>
        <label for="pCategory">Nhóm / dòng sản phẩm</label>
        <input type="text" id="pCategory" placeholder="VD: Andros Pro">
      </div>
      <div>
        <label for="pLaunch">Ngày ra mắt dự kiến</label>
        <input type="date" id="pLaunch">
      </div>
    </div>

    <label for="pCycle">Chu kỳ thực hiện (Tháng 03 – Tháng 03)</label>
    <select id="pCycle"></select>

    <label id="pTemplateWrap" class="check-inline" style="margin-top:14px">
      <input type="checkbox" id="pTemplate" checked>
      Tạo sẵn danh sách 45 công việc mẫu (7 giai đoạn NPD)
    </label>

    <div class="dialog-actions">
      <button type="button" class="btn-danger" id="pDeleteBtn">Xóa sản phẩm</button>
      <div class="toolbar-group">
        <button type="button" class="btn" id="pCancelBtn">Hủy</button>
        <button type="button" class="btn-pri" id="pSaveBtn">Lưu</button>
      </div>
    </div>
  </dialog>

  <!-- Modal Chi tiết Công việc -->
  <dialog id="taskDialog">
    <h3 id="taskDlgTitle">Chi tiết công việc</h3>
    <label for="tStage">Giai đoạn</label>
    <select id="tStage"></select>

    <label for="tName">Tên công việc</label>
    <input type="text" id="tName">

    <div class="form-grid-2">
      <div>
        <label for="tPic">PIC (người phụ trách)</label>
        <input type="text" id="tPic" placeholder="NPD, RD...">
      </div>
      <div>
        <label for="tStatus">Trạng thái</label>
        <select id="tStatus">
          <option value="not">Chưa làm</option>
          <option value="prog">Đang làm</option>
          <option value="done">Hoàn thành</option>
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div>
        <label for="tStart">Bắt đầu</label>
        <input type="date" id="tStart">
      </div>
      <div>
        <label for="tEnd">Hạn / kết thúc</label>
        <input type="date" id="tEnd">
      </div>
    </div>

    <div class="form-grid-2" style="margin-top:10px;align-items:center">
      <label class="check-inline" style="margin:0">
        <input type="checkbox" id="tMilestone">
        Đánh dấu Mốc chốt (Milestone ◆)
      </label>
      <div>
        <label for="tPriority" style="margin-top:0">Mức độ ưu tiên</label>
        <select id="tPriority">
          <option value="normal">Bình thường</option>
          <option value="high">Ưu tiên cao (!)</option>
        </select>
      </div>
    </div>

    <label for="tNote">Ghi chú / Vướng mắc</label>
    <textarea id="tNote" rows="3" placeholder="Ghi chú chi tiết, nguyên nhân trễ hoặc phụ thuộc..."></textarea>

    <div class="dialog-actions">
      <button type="button" class="btn-danger" id="tDeleteBtn">Xóa việc</button>
      <div class="toolbar-group">
        <button type="button" class="btn" id="tCancelBtn">Hủy</button>
        <button type="button" class="btn-pri" id="tSaveBtn">Lưu</button>
      </div>
    </div>
  </dialog>

  <!-- Modal Thêm / Sửa Mẫu R&D -->
  <dialog id="sampleDialog">
    <h3 id="sampleDlgTitle">Thêm mã mẫu R&amp;D</h3>

    <label for="sProduct">Thuộc sản phẩm</label>
    <select id="sProduct"></select>

    <div class="form-grid-2">
      <div>
        <label for="sCode">Mã RD</label>
        <input type="text" id="sCode" placeholder="VD: RD-ST27-01">
      </div>
      <div>
        <label for="sVersion">Phiên bản / Mô tả công thức</label>
        <input type="text" id="sVersion" placeholder="VD: V1 - Ít ngọt">
      </div>
    </div>

    <div class="form-grid-3">
      <div>
        <label for="sPic">PIC R&amp;D</label>
        <input type="text" id="sPic" placeholder="RD - Minh">
      </div>
      <div>
        <label for="sTestDate">Ngày test</label>
        <input type="date" id="sTestDate">
      </div>
      <div>
        <label for="sResult">Kết quả test</label>
        <select id="sResult">
          <option value="pending">Chờ test</option>
          <option value="go">Đạt (Go)</option>
          <option value="revise">Chỉnh sửa</option>
          <option value="nogo">Không đạt</option>
        </select>
      </div>
    </div>

    <div id="sInitialPriceBlock" class="form-grid-3">
      <div>
        <label for="sCvsPrice">Giá CVS (đ)</label>
        <input type="number" id="sCvsPrice" min="0" step="100" placeholder="49500">
      </div>
      <div>
        <label for="sPackCost">Bao bì / NL (đ)</label>
        <input type="number" id="sPackCost" min="0" step="100" placeholder="10800">
      </div>
      <div>
        <label for="sSellPrice">Giá bán DK (đ)</label>
        <input type="number" id="sSellPrice" min="0" step="100" placeholder="112000">
      </div>
    </div>

    <label class="check-inline" style="margin-top:12px">
      <input type="checkbox" id="sApproved">
      Chọn làm mẫu chốt sản xuất cho sản phẩm này
    </label>

    <label for="sNote">Ghi chú cảm quan / QA / Shelf-life</label>
    <textarea id="sNote" rows="2" placeholder="Đánh giá hương vị, độ ổn định, phản hồi sau tasting..."></textarea>

    <div class="dialog-actions">
      <button type="button" class="btn-danger" id="sDeleteBtn">Xóa mẫu</button>
      <div class="toolbar-group">
        <button type="button" class="btn" id="sCancelBtn">Hủy</button>
        <button type="button" class="btn-pri" id="sSaveBtn">Lưu mẫu</button>
      </div>
    </div>
  </dialog>

  <!-- Modal Cập nhật Giá (Ghi lịch sử) -->
  <dialog id="priceDialog">
    <h3>Cập nhật giá mẫu R&amp;D</h3>
    <div id="priceTargetInfo" class="mut" style="margin-top:4px"></div>

    <div class="form-grid-3">
      <div>
        <label for="prCvs">Giá CVS mới (đ)</label>
        <input type="number" id="prCvs" min="0" step="100">
      </div>
      <div>
        <label for="prPack">Bao bì / NL mới (đ)</label>
        <input type="number" id="prPack" min="0" step="100">
      </div>
      <div>
        <label for="prSell">Giá bán DK mới (đ)</label>
        <input type="number" id="prSell" min="0" step="100">
      </div>
    </div>

    <div class="form-grid-2">
      <div>
        <label for="prDate">Ngày cập nhật</label>
        <input type="date" id="prDate">
      </div>
      <div>
        <label>Biên lợi nhuận dự kiến</label>
        <div id="prMarginPreview" class="mono-sm" style="padding:9px 0;font-weight:600">—</div>
      </div>
    </div>

    <label for="prReason">Lý do cập nhật giá</label>
    <input type="text" id="prReason" placeholder="VD: Đổi nhà cung cấp bao bì, tối ưu định lượng hương liệu...">

    <div class="dialog-actions">
      <span></span>
      <div class="toolbar-group">
        <button type="button" class="btn" id="prCancelBtn">Hủy</button>
        <button type="button" class="btn-pri" id="prSaveBtn">Lưu giá mới</button>
      </div>
    </div>
  </dialog>

  <!-- Modal Lịch sử Giá -->
  <dialog id="historyDialog" class="dialog-wide">
    <h3>Lịch sử cập nhật giá</h3>
    <div id="histTargetInfo" class="mut" style="margin:4px 0 12px"></div>
    <div id="histContent" class="table-wrap"></div>
    <div class="dialog-actions">
      <span></span>
      <button type="button" class="btn" id="histCloseBtn">Đóng</button>
    </div>
  </dialog>

  <!-- Modal Xác nhận nội bộ (thay thế confirm/alert) -->
  <dialog id="confirmDialog">
    <h3 id="confirmTitle">Xác nhận</h3>
    <p id="confirmMessage" style="margin:10px 0 0"></p>
    <div class="dialog-actions">
      <span></span>
      <div class="toolbar-group">
        <button type="button" class="btn" id="confirmCancelBtn">Hủy</button>
        <button type="button" class="btn-pri" id="confirmOkBtn">Đồng ý</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
